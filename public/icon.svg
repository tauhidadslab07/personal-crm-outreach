<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="nexusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#nexusGrad)" stroke-width="4" stroke-opacity="0.3" />

  <!-- Nexus Glowing Hexagon / N Monogram -->
  <g filter="url(#glow)">
    <!-- Stylized Modern N -->
    <path
      d="M144 368 V144 L256 280 V144 H288 V368 L176 232 V368 Z"
      fill="none"
    />
    <!-- Bold Tech N Shapes -->
    <path
      d="M136 144 H188 V368 H136 Z"
      fill="url(#nexusGrad)"
      rx="8"
    />
    <path
      d="M324 144 H376 V368 H324 Z"
      fill="url(#nexusGrad)"
      rx="8"
    />
    <path
      d="M168 144 L344 348 H300 L144 168 Z"
      fill="url(#nexusGrad)"
    />
    
    <!-- WhatsApp / Outreach Pulse Wave -->
    <circle cx="396" cy="136" r="28" fill="#10b981" />
    <path d="M386 136 L394 144 L408 128" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
